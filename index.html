<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADVENTURE NIM</title>
    <link rel="shortcut icon" href="icons8-mario.png" type="image x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <input type="checkbox" id="start-game">
        <section class="start-screen">
            <img src="overlay.jpeg" alt="ADVENTURE NIM" class="game-title">
            <label for="start-game" class="start-button">START GAME</label>
        </section>
        <section class="world">
            <div class="sky-effects"></div>
            <img src="cloud.jpeg" alt="" class="cloud cloud-one">
            <img src="cloud2.jpeg" alt="" class="cloud cloud-two">
            <div class="game-items">
                <img src="box.jpeg" alt="" class="question question-one">
                <img src="box.jpeg" alt="" class="question question-two">
                <img src="coin.jpeg" alt="" class="coin coin-one">
                <img src="coin.jpeg" alt="" class="coin coin-two">
                <img src="mushroom.jpeg" alt="" class="enemy">
                <img src="mario.jpeg" alt="Hero" class="hero">
                <img src="castle.jpeg" alt="Castle" class="castle">
            </div>
        </section>
    </main>
</body>
</html>
